version: '3'

vars:
  TRAIN_PYTHON: ../.venv-training/bin/python

tasks:
  setup:
    desc: Create Python 3.9 venv and install training dependencies (handles TF/Model Maker conflict)
    cmds:
      - |
        UV="${HOME}/.local/bin/uv"
        # Ensure arm64 CPython 3.9 is available (downloads if needed)
        "$UV" python install cpython-3.9.25-macos-aarch64 2>/dev/null || true
        "$UV" venv ../.venv-training --python cpython-3.9.25-macos-aarch64
        UPY="$UV pip install --python ../.venv-training/bin/python"
        # Install TF (tensorflow-metal excluded — symbol incompatibility on macOS 15)
        $UPY tensorflow-macos==2.9.2
        # Pin numpy to 1.23.x — tensorflowjs 3.18 uses np.object (removed in 1.24)
        $UPY "numpy==1.23.5"
        # Install tflite-model-maker and its problematic transitive deps all --no-deps
        # to prevent them from pulling in tensorflow 2.x which would shadow tensorflow-macos
        $UPY tflite-model-maker==0.4.2 --no-deps
        $UPY --no-deps \
          "tensorflow-hub==0.12.0" \
          "neural-structured-learning==1.4.0" \
          "tensorflow-model-optimization==0.7.5" \
          "tensorflowjs==3.18.0" \
          "tensorflow-addons" \
          "tf-models-official==2.9.2" \
          "tensorflow-datasets"
        $UPY gin-config typeguard
        # Install remaining dependencies
        $UPY kagglehub "ImageHash>=4.3.1" "scikit-learn>=1.3.0" \
          "pycocotools>=2.0.7" jupyter "matplotlib>=3.7.0" "seaborn>=0.12.0" \
          "Pillow>=9.5.0" requests lxml \
          "opencv-python>=4.8.0" tqdm "pytest>=7.0.0"
        # Apply compatibility patches to tflite-model-maker for arm64 macOS 15
        ../.venv-training/bin/python scripts/patch_venv.py ../.venv-training

  download:
    desc: Download PV thermal datasets from Kaggle and Zenodo (~1.5 GB, requires ~/.kaggle/kaggle.json)
    cmds:
      - "{{.TRAIN_PYTHON}} scripts/download_data.py --output data/raw"

  preprocess:
    desc: Normalize IR images, unify annotations, deduplicate, split 80/10/10
    cmds:
      - "{{.TRAIN_PYTHON}} scripts/preprocess.py --raw data/raw --output data/processed"

  train:
    desc: Fine-tune EfficientDet-Lite0 on PV thermal dataset (50 epochs, Metal GPU)
    cmds:
      - "{{.TRAIN_PYTHON}} scripts/train.py --data data/processed --output models"

  export:
    desc: Compile quantized TFLite model for EdgeTPU and verify compilation quality
    cmds:
      - "{{.TRAIN_PYTHON}} scripts/export.py --quant models/pv_detector_quant.tflite --output models"

  deploy:
    desc: Copy trained PV model into models/ for use with task detect-pv
    cmds:
      - |
        if [ ! -f "models/pv_detector_edgetpu.tflite" ]; then
          echo "ERROR: pv_detector_edgetpu.tflite not found. Run task training:export first."
          exit 1
        fi
        if [ ! -f "models/pv_labels.txt" ]; then
          echo "ERROR: pv_labels.txt not found. Run task training:export first."
          exit 1
        fi
        cp models/pv_detector_edgetpu.tflite ../models/
        cp models/pv_labels.txt ../models/
        echo "Deployed pv_detector_edgetpu.tflite and pv_labels.txt to models/"

  test:
    desc: Run training pipeline unit tests (no GPU or data required)
    cmds:
      - "{{.TRAIN_PYTHON}} -m pytest tests/ -v"
