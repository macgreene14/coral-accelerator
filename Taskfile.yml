version: '3'

vars:
  PYTHON: .venv/bin/python
  EDGETPU_RUNTIME_URL: https://github.com/google-coral/libedgetpu/releases/download/release-grouper/edgetpu_runtime_20221024.zip

tasks:
  install-edgetpu:
    desc: Download and install the Coral EdgeTPU runtime as x86_64 via Rosetta (requires sudo)
    cmds:
      - |
        EDGETPU_LIB="/usr/local/lib/libedgetpu.1.dylib"
        ARCH=$(file "$EDGETPU_LIB" 2>/dev/null | grep -o 'x86_64\|arm64' | head -1)
        if [ "$ARCH" = "x86_64" ]; then
          echo "libedgetpu already installed as x86_64 at $EDGETPU_LIB"
          exit 0
        fi
        if [ -f "$EDGETPU_LIB" ]; then
          echo "Found $ARCH libedgetpu — removing to reinstall as x86_64..."
          sudo rm "$EDGETPU_LIB"
        fi
        echo "Downloading Coral EdgeTPU runtime..."
        TMP=$(mktemp -d)
        curl -L -o "$TMP/edgetpu_runtime.zip" "{{.EDGETPU_RUNTIME_URL}}"
        unzip -q "$TMP/edgetpu_runtime.zip" -d "$TMP"
        echo "Running installer under Rosetta (sudo required)..."
        arch -x86_64 sudo bash "$TMP/edgetpu_runtime/install.sh"
        rm -rf "$TMP"
        echo "Done. Verifying architecture..."
        file "$EDGETPU_LIB"
        # libedgetpu was built against /opt/homebrew/lib/libusb-1.0.0.dylib (arm64 path).
        # On Apple Silicon we need the x86_64 libusb from Rosetta Homebrew (/usr/local).
        X86_BREW="/usr/local/bin/brew"
        if [ -f "$X86_BREW" ]; then
          echo "Installing x86_64 libusb via Rosetta Homebrew..."
          arch -x86_64 "$X86_BREW" install libusb
          echo "Patching libedgetpu to use x86_64 libusb path..."
          install_name_tool -change \
            /opt/homebrew/lib/libusb-1.0.0.dylib \
            /usr/local/lib/libusb-1.0.0.dylib \
            "$EDGETPU_LIB"
          echo "Patch applied. Verifying:"
          otool -L "$EDGETPU_LIB" | grep libusb
        else
          echo "WARNING: Rosetta Homebrew not found at $X86_BREW"
          echo "If pycoral fails to load, install x86_64 Homebrew and re-run this task."
        fi

  patch-edgetpu-libusb:
    desc: Patch libedgetpu to use x86_64 libusb (run once manually if install-edgetpu can't sudo)
    cmds:
      - |
        EDGETPU_LIB="/usr/local/lib/libedgetpu.1.0.dylib"
        X86_LIBUSB="/usr/local/lib/libusb-1.0.0.dylib"
        if [ ! -f "$X86_LIBUSB" ]; then
          echo "ERROR: x86_64 libusb not found at $X86_LIBUSB"
          echo "Run: arch -x86_64 /usr/local/bin/brew install libusb"
          exit 1
        fi
        CURRENT=$(otool -L "$EDGETPU_LIB" | grep libusb | awk '{print $1}')
        if [ "$CURRENT" = "$X86_LIBUSB" ]; then
          echo "libedgetpu already patched (libusb path is $CURRENT)"
          exit 0
        fi
        echo "Patching $EDGETPU_LIB: $CURRENT -> $X86_LIBUSB"
        sudo install_name_tool -change "$CURRENT" "$X86_LIBUSB" "$EDGETPU_LIB"
        echo "Done. Verifying:"
        otool -L "$EDGETPU_LIB" | grep libusb

  install:
    desc: Install uv (if missing), check libedgetpu, set up Python 3.9 venv and dependencies
    cmds:
      - |
        # We need an x86_64 uv binary to create a Rosetta venv + install pycoral wheels.
        # The default uv installer produces a native arm64 binary on Apple Silicon,
        # which cannot be spawned under arch -x86_64. Install a separate x86_64 copy.
        UV_X86="$HOME/.local/bin/uv-x86_64"
        if [ ! -f "$UV_X86" ] || ! file "$UV_X86" | grep -q x86_64; then
          echo "Installing x86_64 uv via Rosetta..."
          TMP=$(mktemp -d)
          # Download the macOS x86_64 uv binary directly from the GitHub release
          UV_VERSION=$(curl -fsSL https://api.github.com/repos/astral-sh/uv/releases/latest | grep '"tag_name"' | sed 's/.*"v\([^"]*\)".*/\1/')
          curl -fsSL "https://github.com/astral-sh/uv/releases/download/0.${UV_VERSION#0.}/uv-x86_64-apple-darwin.tar.gz" \
            -o "$TMP/uv-x86_64.tar.gz" 2>/dev/null || \
          curl -fsSL "https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-apple-darwin.tar.gz" \
            -o "$TMP/uv-x86_64.tar.gz"
          tar -xzf "$TMP/uv-x86_64.tar.gz" -C "$TMP"
          cp "$TMP/uv-x86_64-apple-darwin/uv" "$UV_X86"
          chmod +x "$UV_X86"
          rm -rf "$TMP"
          echo "x86_64 uv installed at $UV_X86"
        else
          echo "x86_64 uv already present at $UV_X86"
        fi
        EDGETPU_LIB="/usr/local/lib/libedgetpu.1.dylib"
        if [ ! -f "$EDGETPU_LIB" ]; then
          echo ""
          echo "ERROR: libedgetpu not found at $EDGETPU_LIB"
          echo ""
          echo "Install the Coral EdgeTPU runtime:"
          echo "  https://coral.ai/docs/accelerator/get-started/#1-install-the-edge-tpu-runtime"
          echo ""
          echo "After installing, re-run: task install"
          exit 1
        fi
        echo "libedgetpu found at $EDGETPU_LIB"
        arch -x86_64 "$UV_X86" venv --python 3.9
        arch -x86_64 "$UV_X86" sync --extra dev
        # pycoral's .so uses @rpath/libedgetpu.1.dylib; DYLD_LIBRARY_PATH is stripped
        # by macOS SIP when spawning under Rosetta, so symlink the lib into pybind/.
        PYBIND=".venv/lib/python3.9/site-packages/pycoral/pybind"
        ln -sf "$EDGETPU_LIB" "$PYBIND/libedgetpu.1.dylib"
        echo "Symlinked libedgetpu into $PYBIND"

  download-models:
    desc: Download classification and detection models + labels into models/
    cmds:
      - mkdir -p models
      - |
        if [ ! -f "models/mobilenet_v2_1.0_224_quant_edgetpu.tflite" ]; then
          echo "Downloading MobileNet v2 EdgeTPU model..."
          curl -L -o models/mobilenet_v2_1.0_224_quant_edgetpu.tflite \
            "https://github.com/google-coral/test_data/raw/master/mobilenet_v2_1.0_224_quant_edgetpu.tflite"
        else
          echo "Model already present: models/mobilenet_v2_1.0_224_quant_edgetpu.tflite"
        fi
      - |
        if [ ! -f "models/imagenet_labels.txt" ]; then
          echo "Downloading ImageNet labels..."
          curl -L -o models/imagenet_labels.txt \
            "https://raw.githubusercontent.com/google-coral/test_data/master/imagenet_labels.txt"
        else
          echo "Labels already present: models/imagenet_labels.txt"
        fi
      - |
        if [ ! -f "models/ssd_mobilenet_v2_coco_quant_postprocess_edgetpu.tflite" ]; then
          echo "Downloading SSD MobileNet v2 COCO EdgeTPU model..."
          curl -L -o models/ssd_mobilenet_v2_coco_quant_postprocess_edgetpu.tflite \
            "https://github.com/google-coral/test_data/raw/master/ssd_mobilenet_v2_coco_quant_postprocess_edgetpu.tflite"
        else
          echo "Model already present: models/ssd_mobilenet_v2_coco_quant_postprocess_edgetpu.tflite"
        fi
      - |
        if [ ! -f "models/coco_labels.txt" ]; then
          echo "Downloading COCO labels..."
          curl -L -o models/coco_labels.txt \
            "https://raw.githubusercontent.com/google-coral/test_data/master/coco_labels.txt"
        else
          echo "Labels already present: models/coco_labels.txt"
        fi

  classify:
    desc: Run image classification using the laptop camera and Coral USB Accelerator
    env:
      DYLD_LIBRARY_PATH: /usr/local/lib
    cmds:
      - "arch -x86_64 {{.PYTHON}} src/classify.py"

  detect:
    desc: Object detection (not yet implemented)
    cmds:
      - echo "Detection not yet implemented — run 'task classify' instead"

  test:
    desc: Run unit tests (no EdgeTPU or camera required)
    cmds:
      - "{{.PYTHON}} -m pytest tests/ -v"
